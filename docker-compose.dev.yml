version: '3.9'

# Development override — mounts source code for hot reload
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app          # Live code reload
      - uploads_data:/app/uploads
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./saas_summarizer.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    # No postgres/redis dependency in dev — uses SQLite
    depends_on: {}

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  uploads_data:
