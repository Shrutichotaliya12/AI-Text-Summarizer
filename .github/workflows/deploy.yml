name: CI/CD — AI Text Summarizer Pro

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-summarizer

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Frontend — Lint, Type-check, Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Backend — Lint, Test, Validate
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax / import validation
        run: python -c "import ast, os; [ast.parse(open(os.path.join(r, f)).read()) for r,d,files in os.walk('../backend/app') for f in files if f.endswith('.py')]"

      - name: Run pytest suite
        run: |
          pytest tests/ -v --tb=short --timeout=30
        env:
          PYTHONPATH: .
          ENVIRONMENT: testing
          JWT_SECRET: test_jwt_secret_for_ci_only
          DATABASE_URL: sqlite:///./test.db
