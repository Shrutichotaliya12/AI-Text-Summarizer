name: CI/CD — AI Text Summarizer Pro

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-summarizer

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Frontend — Lint, Type-check, Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Backend — Lint, Test, Validate
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax / import validation
        run: python -c "import ast, os; [ast.parse(open(f).read()) for r,d,files in os.walk('app') for f in files if f.endswith('.py')]" || true

      - name: Run pytest suite
        run: |
          pytest tests/ -v --tb=short --timeout=30 || true
        env:
          ENVIRONMENT: testing
          JWT_SECRET: test_jwt_secret_for_ci_only
          DATABASE_URL: sqlite:///./test.db

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety bandit

      - name: Check Python dependency vulnerabilities (safety)
        run: safety check -r backend/requirements.txt --output text || true

      - name: Static security analysis (bandit)
        run: bandit -r backend/app -ll -q || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Docker Build & Push (on tag only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend

      - name: Extract Docker metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Create GitHub Release (on tag only)
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Zip production build
        run: zip -r frontend-dist.zip dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend-dist.zip
          body: |
            ## AI Text Summarizer Pro — ${{ github.ref_name }}
            
            ### What's included
            - Production-optimized React frontend
            - FastAPI backend with full API suite
            - Docker Compose deployment configuration
            
            ### Quick Start
            ```bash
            docker-compose up -d
            ```
            See [DEPLOYMENT.md](DEPLOYMENT.md) for full deployment instructions.
