# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/adapters/database/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# timezone = UTC

# max length of characters to prepend to the slug
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow alembic to begin
# transaction before calling connection-level callbacks
# transaction_per_migration = false

# version locations.  specifies where to find version files.
# defaults to script_location/versions.
# version_locations = %(here)s/bar:%(here)s/bat

# version path separator; defaults to OS line separator.
# version_path_separator = :

sqlalchemy.url = postgresql://postgres:postgres_password@localhost:5432/summarizer_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
